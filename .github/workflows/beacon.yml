name: beacon
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - 'live/**'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: beacon
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: crawl every source
        run: node crawl.mjs
      - name: merge into the cumulative board
        run: node merge-beacon.mjs beacon.fresh.json
      - name: commit if changed
        continue-on-error: true
        run: |
          git config user.name beacon
          git config user.email beacon@users.noreply.github.com
          git add beacon.json tree.json history.json || true
          git commit -m "beacon: cumulative crawl $(date -u +%FT%TZ)" || true
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
