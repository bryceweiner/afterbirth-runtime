name: beacon
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: fetch live roster
        run: |
          mkdir -p .
          curl -fsS --max-time 25 http://207.148.20.113:9099/beacon.json -o /tmp/bc.json && cp /tmp/bc.json beacon.json || echo 'kept previous beacon.json'
          head -c 200 beacon.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: install tree deps
        run: npm i --no-save tweetnacl bs58 @solana/web3.js >/dev/null 2>&1
      - name: refresh tree
        env:
          FOUNDER_KEY: ${{ secrets.FOUNDER_KEY }}
        run: |
          printf '%s' "$FOUNDER_KEY" > /tmp/key.json
          node merkle.mjs build beacon.json /tmp/key.json tree.json
          node anchor-root.mjs tree.json || echo "anchor skipped"
      - name: commit if changed
        run: |
          git config user.name beacon
          git config user.email beacon@users.noreply.github.com
          git add beacon.json tree.json
          git diff --cached --quiet || git commit -m "beacon: $(date -u +%FT%TZ)"
          git push
