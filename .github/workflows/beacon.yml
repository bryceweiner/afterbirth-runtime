name: beacon
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: fetch live roster
        run: |
          mkdir -p .
          node -e "
          const fs=require('fs');
          const src=fs.readFileSync('sources.txt','utf8').split('
').map(x=>x.trim()).filter(Boolean);
          (async()=>{for(const s of src){try{const j=await (await fetch(s.replace(/\/$/,'')+'/beacon.json',{signal:AbortSignal.timeout(12000)})).json();if(j&&Array.isArray(j.agents)&&j.agents.length){fs.writeFileSync('beacon.json',JSON.stringify(j,null,1));console.log('source',s,'agents',j.agents.length);process.exit(0)}}catch(e){console.log('miss',s)}}console.log('kept previous')})();
          " 
          head -c 200 beacon.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: commit if changed
        run: |
          git config user.name beacon
          git config user.email beacon@users.noreply.github.com
          git add beacon.json sources.txt
          git diff --cached --quiet || git commit -m "beacon: $(date -u +%FT%TZ)"
          git push
